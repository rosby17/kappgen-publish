<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>KappGen Uploader · autorisation</title>
<style>
  body { font: 14px/1.45 -apple-system, system-ui, sans-serif; background: #0f1b33; color: #e8eefc; margin: 0; padding: 22px 24px; text-align: center; }
  h1 { font-size: 17px; margin: 10px 0 6px; }
  p { margin: 6px 0; color: #c8d4ee; }
  strong { color: #fff; }
  button { font: inherit; font-weight: 700; font-size: 16px; width: 100%; padding: 12px; margin: 14px 0 8px; border: 0; border-radius: 10px; background: #2f6bff; color: #fff; cursor: pointer; }
  button:hover { background: #4a7dff; }
  .hint { font-size: 12.5px; color: #9fb0d0; }
  .ok { color: #7ee2a8; font-weight: 600; }

<body>
  <img src="icons/icon48.png" alt="" width="40" height="40">
  <h1>Accès à ton dossier de vidéos</h1>
  <p id="message">Chrome demande de confirmer l’accès au dossier.</p>
  <button id="grant">Autoriser</button>
  <p class="hint">Dans la fenêtre de Chrome qui s’ouvre, choisis <strong>« Autoriser à chaque visite »</strong> : tu n’auras plus à le refaire.</p>
